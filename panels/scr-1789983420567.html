      padding: 0;

    body {
      display: flex;
      flex-direction: column;
    }

    .shell-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .top-bar {
      height: 56px;
      background-color: var(--top-bar-bg);
      border-bottom: var(--border-width) solid var(--top-bar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 calc(var(--space-unit) * 3);
      flex-shrink: 0;
    }

    .top-bar-brand {
      display: flex;
      align-items: center;
      gap: calc(var(--space-unit) * 1.5);
    }

    .top-bar-brand-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--top-bar-text);
      letter-spacing: -0.3px;
    }

    .top-bar-brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .top-bar-user {
      display: flex;
      align-items: center;
      gap: calc(var(--space-unit) * 1.5);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      flex-shrink: 0;
    }

    .user-name {
      font-size: 13px;
      color: var(--top-bar-text);
      font-weight: 500;
    }

    .user-logout {
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
      transition: color var(--motion-duration);
    }

    .user-logout:hover {
      color: var(--primary-hover);
    }

    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: var(--border-width) solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-nav {
      flex: 1;
      padding: calc(var(--space-unit) * 2) 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      height: 40px;
      padding: 0 calc(var(--space-unit) * 2);
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: background-color var(--motion-duration), color var(--motion-duration);
      border-left: 3px solid transparent;
    }

    .nav-item:hover {
      background-color: rgba(44, 62, 80, 0.05);
    }

    .nav-item.aivic-active {
      background-color: rgba(44, 62, 80, 0.1);
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 500;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      background-color: var(--bg-main);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
    }

    [data-aivic-panel] {
      min-height: 100%;
    }

    .panel-container {
      padding: calc(var(--space-unit) * 3);
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .shell-wrapper {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: var(--border-width) solid var(--border);
      }

      .sidebar-nav {
        display: flex;
        padding: 0;
      }

      .nav-item {
        flex: 1;
        border-left: none;
        border-bottom: 3px solid transparent;
        justify-content: center;
        padding: 0;
      }

      .nav-item.aivic-active {
        border-left: none;
        border-bottom-color: var(--primary);
      }

      .top-bar {
        padding: 0 calc(var(--space-unit) * 2);
      }

      .top-bar-brand-subtitle {
        display: none;
      }

      .panel-container {
        padding: calc(var(--space-unit) * 2);
      }
    }
  </style>

ml(dateStr) + '</td>' +\n        '<td style=\\\"padding: calc(var(--space-unit) * 1.5); font-size: 13px; color: var(--text);\\\">' + escapeHtml(summary) + '</td>' +\n        '<td style=\\\"padding: calc(var(--space-unit) * 1.5); text-align:center;\\\"><button class=\\\"btn-detail\\\" data-id=\\\"' + escapeHtml(r.日報ID) + '\\\" style=\\\"padding: 4px 10px; font-size:12px; border:1px solid var(--border); background: transparent; color: var(--text); border-radius: var(--radius-control); cursor:pointer;\\\">詳細</button></td>' +\n        '</tr>';\n    }).join('');\n\n    submittedBody.querySelectorAll('tr').forEach(function(tr) {\n      tr.addEventListener('mouseenter', function() { tr.style.background = 'var(--bg-sidebar)'; });\n      tr.addEventListener('mouseleave', function() { tr.style.background = 'transparent'; });\n    });\n    submittedBody.querySelectorAll('.btn-detail').forEach(function(btn) {\n      btn.addEventListener('click', function() {\n        var id = btn.getAttribute('data-id');\n        var report = reports.find(function(r) { return r.日報ID === id; });\n        if (!report) return;\n        var user = userById(report.ユーザーID);\n        container.querySelector('#detail-reporter').textContent = user ? user.氏名 : '不明';\n        container.querySelector('#detail-date').textContent = String(report.報告日 || '').slice(0, 10);\n        container.querySelector('#detail-content').textContent = report.業務内容 || '-';\n        detailOverlay.style.display = 'flex';\n      });\n    });\n  }\n\n  function computeUnsubmitted() {\n    var byUser = {};\n    logs.forEach(function(log) {\n      if (log.提出状況 === '提出済み') return;\n      var uid = log.ユーザーID;\n      var dateStr = String(log.対象日付 || '').slice(0, 10);\n      if (!byUser[uid] || dateStr < byUser[uid]) byUser[uid] = dateStr;\n    });\n    return Object.keys(byUser).map(function(uid) { return { userId: uid, since: byUser[uid] }; });\n  }\n\n  function renderUnsubmitted() {\n    var list = computeUnsubmitted();\n    unsubmittedCount.textContent = list.length + '件';\n    if (list.length === 0) {\n      unsubmittedBody.innerHTML = '<tr><td colspan=\\\"4\\\" style=\\\"padding: calc(var(--space-unit) * 3); text-align:center; color: var(--text-muted); font-size:13px;\\\">未提出者はいません</td></tr>';\n      return;\n    }\n    unsubmittedBody.innerHTML = list.map(function(item) {\n      var user = userById(item.userId);\n      var name = user ? user.氏名 : '不明';\n      var dept = (user && user.部門) || '-';\n      return '<tr style=\\\"border-bottom: 1px solid var(--border);\\\">' +\n        '<td style=\\\"padding: calc(var(--space-unit) * 1.5); font-size: 13px; color: var(--text);\\\">' + escapeHtml(name) + '</td>' +\n        '<td style=\\\"padding: calc(var(--space-unit) * 1.5); font-size: 13px; color: var(--text);\\\">' + escapeHtml(dept) + '</td>' +\n        '<td style=\\\"padding: calc(var(--space-unit) * 1.5); font-size: 13px; color: var(--text);\\\">' + escapeHtml(item.since) + ' 〜 本日</td>' +\n        '<td style=\\\"padding: calc(var(--space-unit) * 1.5); text-align:center;\\\"><button class=\\\"btn-remind\\\" data-user-id=\\\"' + escapeHtml(item.userId) + '\\\" style=\\\"padding: 4px 10px; font-size:12px; border:1px solid var(--primary); background: transparent; color: var(--primary); border-radius: var(--radius-control); cursor:pointer;\\\">送信</button></td>' +\n        '</tr>';\n    }).join('');\n\n    unsubmittedBody.querySelectorAll('tr').forEach(function(tr) {\n      tr.addEventListener('mouseenter', function() { tr.style.background = 'var(--bg-sidebar)'; });\n      tr.addEventListener('mouseleave', function() { tr.style.background = 'transparent'; });\n    });\n    unsubmittedBody.querySelectorAll('.btn-remind').forEach(function(btn) {\n      btn.addEventListener('click', function() {\n        var uid = btn.getAttribute('data-user-id');\n        var user = userById(uid);\n        reminderTarget = { type: 'single', userId: uid };\n        reminderMessage.textContent = (user ? user.氏名 : '対象者') + ' さんにリマインダーを送信しますか？';\n        reminderOverlay.style.display = 'flex';\n      });\n    });\n  }\n\n  bulkReminderBtn.addEventListener('click', function() {\n    var list = computeUnsubmitted();\n    if (list.length === 0) {\n      showStatus('未提出者はいません');\n      return;\n    }\n    reminderTarget = { type: 'bulk' };\n    reminderMessage.textContent = '未提出者全員（' + list.length + '件）にリマインダーを送信しますか？';\n    reminderOverlay.style.display = 'flex';\n  });\n\n  confirmReminderBtn.addEventListener('click', function() {\n    if (!reminderTarget) { closeModals(); return; }\n    var now = new Date().toISOString();\n    var targets = reminderTarget.type === 'single' ? [reminderTarget.userId] : computeUnsubmitted().map(function(i) { return i.userId; });\n    var sentCount = 0;\n    var chain = Promise.resolve();\n    targets.forEach(function(uid) {\n      chain = chain.then(function() {\n        if (mailIndex === -1) return null;\n        var user = userById(uid);\n        return window.aivicApi.save(mailIndex, {\n          ユーザーID: uid,\n          メールタイプ: 'リマインダー',\n          送信先メールアドレス: (user && user.メールアドレス) || 'unknown@example.com',\n          件名: '【リマインダー】本日の日報提出をお願いします',\n          本文: (user ? user.氏名 : '') + '様、本日の日報がまだ提出されていません。ご提出をお願いします。',\n          送信日時: now,\n          送信ステータス: '成功',\n          再送信フラグ: false,\n          作成日時: now\n        }).then(function(ok) { if (ok) sentCount++; });\n      });\n    });\n    chain.then(function() {\n      closeModals();\n      showStatus('リマインダーを ' + sentCount + ' 件送信しました');\n    });\n  });\n\n  searchInput.addEventListener('input', function() {\n    renderSubmitted(searchInput.value.trim());\n  });\n\n  settingsBtn.addEventListener('click', function() {\n    if (window.showScreen) window.showScreen('scr-1789983420568');\n  });\n\n  backToInputBtn.addEventListener('click', function() {\n    if (window.showScreen) window.showScreen('scr-1789983412165');\n  });\n\n  renderSubmitted('');\n  renderUnsubmitted();\n}";
</script>

<body>
  <div class="top-bar">

  <div class="shell-wrapper" data-aivic-shell-pattern="sidebar" data-aivic-nav-position="left" data-aivic-density="simple">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a class="nav-item aivic-active" data-aivic-nav="scr-1789983412165" href="./scr-1789983412165.html">日報入力</a>

    <main class="content-area">
      <div data-aivic-panel="scr-1789983412165" style="display:none"></div>

  <div style="display: flex; flex-direction: column; height: 100%; background: var(--bg-main);">

    <div style="padding: calc(var(--space-unit) * 2) calc(var(--space-unit) * 3); border-bottom: 1px solid var(--border); background: var(--bg-card); display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 12px; color: var(--text-muted); font-family: var(--font-family);">シンプルデイレポート / 日報管理 / 日報確認・管理</div>
    </main>

<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // AI シェルが SPA 用の初期表示処理を持っていても、マルチページでは
    // このファイルに割り当てられた画面だけを表示する。
    document.querySelectorAll('[data-aivic-panel]').forEach(function(panel) {
      var isCurrent = panel.getAttribute('data-aivic-panel') === pageScreenId;
      panel.style.display = isCurrent ? 'block' : 'none';
    });

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
